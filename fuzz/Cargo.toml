[package]
name = "blitz-py-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["svg", "woff"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.15"
anyrender_vello_cpu = "0.19"

# Same Blitz as the binding: the pinned fork commit (see ../Cargo.toml).
[patch.crates-io]
blitz-dom = { git = "https://github.com/adrienbrault/blitz", rev = "d9099efa6d0a85eb40a93c2881b6c0b92c98a50b" }
blitz-html = { git = "https://github.com/adrienbrault/blitz", rev = "d9099efa6d0a85eb40a93c2881b6c0b92c98a50b" }
blitz-paint = { git = "https://github.com/adrienbrault/blitz", rev = "d9099efa6d0a85eb40a93c2881b6c0b92c98a50b" }
blitz-traits = { git = "https://github.com/adrienbrault/blitz", rev = "d9099efa6d0a85eb40a93c2881b6c0b92c98a50b" }

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false
