        <span class="h-1.5 w-1.5 rounded-full bg-sky-400 animate-[blink_1s_steps(1)_infinite]"></span>
        <span class="text-xs text-slate-300">rolling out v2.15</span>
      </div>
      <div class="relative mt-3 h-1.5 overflow-hidden rounded-full bg-white/10">
        <div class="absolute h-full w-2/5 rounded-full bg-gradient-to-r from-sky-500 to-violet-500 animate-[sweep_2s_ease-in-out_infinite]"></div>
      </div>
      <div class="mt-3 flex gap-1">
        <span class="h-1 w-1 rounded-full bg-slate-500 animate-[blip_1s_linear_infinite]"></span>
        <span class="h-1 w-1 rounded-full bg-slate-500 animate-[blip_1s_linear_0.2s_infinite]"></span>
        <span class="h-1 w-1 rounded-full bg-slate-500 animate-[blip_1s_linear_0.4s_infinite]"></span>
      </div>
    </div>
  </div>

  <div class="mt-3 rounded-xl bg-black/40 p-3 ring-1 ring-white/10">
    <div class="flex items-center gap-1.5 font-mono text-[11px]">
      <span class="text-emerald-400">$</span>
      <span class="inline-block overflow-hidden whitespace-nowrap text-slate-300 animate-[typing_4s_steps(26)_infinite]">blitz render --animate widgets/*</span><span class="-ml-1 text-slate-300 animate-[blink_1s_steps(1)_infinite]">&#9613;</span>
    </div>
  </div>
</div>
