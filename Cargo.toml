[package]
name = "blitz-py"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for the Blitz HTML/CSS rendering engine"
repository = "https://github.com/adrienbrault/blitz-py"

[lib]
name = "blitz_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310", "generate-import-lib"] }
# Blitz is pinned to a `main` commit (post-0.3.0-beta.1, no newer crates.io
# release yet) for ~140 layout/robustness fixes; see docs/UPSTREAM.md. The
# anyrender/anyrender_vello_cpu/parley versions below must match that commit's
# workspace Cargo.toml. Return to a crates.io version at the next release.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "01a6c4b9282c25b76616d71863ea55a03c48a730", default-features = false }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "01a6c4b9282c25b76616d71863ea55a03c48a730" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "01a6c4b9282c25b76616d71863ea55a03c48a730" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "01a6c4b9282c25b76616d71863ea55a03c48a730" }
anyrender = "0.13"
anyrender_vello_cpu = "0.16"
parley = "0.11"
# fontconfig-dlopen: load fontconfig at runtime if present instead of linking
# it. Keeps Linux wheels free of a libfontconfig link dependency (forbidden by
# manylinux/musllinux policies) while still discovering system fonts on
# distros that have it.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }
peniko = "0.6"
data-url = "0.3"
png = "0.17"
jpeg-encoder = "0.7"
color_quant = "2"
gif = "0.14"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
