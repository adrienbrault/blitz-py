[package]
name = "blitz-py"
version = "0.6.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for the Blitz HTML/CSS rendering engine"
repository = "https://github.com/adrienbrault/blitz-py"

[lib]
name = "blitz_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310", "generate-import-lib"] }
# The anyrender/anyrender_vello_cpu/parley versions below must match the
# blitz release's workspace Cargo.toml; re-pair on every bump (docs/UPSTREAM.md).
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["woff"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
parley = "0.12"
# fontconfig-dlopen: load fontconfig at runtime if present instead of linking
# it. Keeps Linux wheels free of a libfontconfig link dependency (forbidden by
# manylinux/musllinux policies) while still discovering system fonts on
# distros that have it.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
peniko = "0.6"
data-url = "0.3"
# Header-only dimension sniffing for the decode-bomb guard. Same version and
# formats blitz-dom decodes with, so this adds no code to the build.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
png = "0.18"
jpeg-encoder = "0.7"
color_quant = "2"
gif = "0.14"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
