name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Rust unit tests
        run: cargo test --lib
      - name: Build and install
        shell: bash
        run: |
          pip install maturin pytest
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Test
        run: pytest tests/ -v
      - name: Golden hashes
        shell: bash
        run: python scripts/golden.py | tee "golden-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: golden-${{ matrix.os }}
          path: golden-*.json

  golden:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: golden-*
          path: goldens
          merge-multiple: true
      - name: Assert cross-platform determinism
        run: |
          cd goldens
          cat *.json
          unique=$(md5sum *.json | awk '{print $1}' | sort -u | wc -l)
          if [ "$unique" != "1" ]; then
            echo "::error::Renders are not byte-identical across platforms"
            exit 1
          fi
          echo "All platforms produced identical renders."

  # Wheels the test jobs below install. Built on every run, PRs included.
  linux-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: "2_28"
            name: manylinux-x86_64
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            name: musllinux-x86_64
          # 32-bit ARM (Raspberry Pi OS 32-bit). Blocked until anyrender
          # 0.14 gained a 32-bit FilterEffect size assertion.
          - target: armv7-unknown-linux-musleabihf
            manylinux: musllinux_1_2
            name: musllinux-armv7
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  # Build-only wheels (no job tests them), plus macOS/Windows/sdist below:
  # skipped on PRs, since `test` already covers each OS. They still run on
  # main and on tags, and `publish` needs every one of them.
  linux-wheels-extra:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            manylinux: "2_28"
            name: manylinux-aarch64
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            name: musllinux-aarch64
          - target: armv7
            manylinux: "2014"
            name: manylinux-armv7
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  # The abi3 wheel on every supported CPython (3.14 runs in `test`).
  python-versions:
    needs: linux-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-manylinux-x86_64
          path: dist
      - run: pip install dist/*.whl pytest
      - run: python -m pytest tests/ -q

  # Home Assistant containers are Alpine (musl) on recent CPython.
  musl-test:
    needs: linux-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - name: Test the musl wheel in Alpine
        run: |
          docker run --rm -v "$PWD":/io -w /io python:${{ matrix.python }}-alpine sh -c '
            pip install -q dist/*.whl pytest
            python -m pytest tests/ -q'

  # Regression: fontconfig installed but zero fonts (fresh Home Assistant
  # base images). fontique <= 0.11 panicked enumerating system fonts on
  # such hosts (fixed in 0.12); the bundled font must still render text.
  fontless-test:
    needs: linux-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - name: Render on fontconfig-with-no-fonts Alpine
        run: |
          docker run --rm -v "$PWD":/io -w /io python:3.14-alpine sh -c '
            apk add -q fontconfig
            test "$(fc-list | wc -l)" = 0 || { echo "host has fonts; test is vacuous"; exit 1; }
            pip install -q dist/*.whl
            python scripts/fontless_check.py'

  # 32-bit ARM under QEMU: proves the armv7 wheel runs, not just builds.
  armv7-test:
    needs: linux-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - uses: actions/download-artifact@v8
        with:
          name: wheels-musllinux-armv7
          path: dist
      - name: Test the armv7 musl wheel in Alpine
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD":/io -w /io python:3.14-alpine sh -c '
            pip install -q dist/*.whl pytest
            python -m pytest tests/ -q'

  macos-wheels:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  windows-wheels:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            args: --release --out dist
          - target: aarch64-pc-windows-msvc
            # Cross-build: no arm64 Python on the x64 runner; name the
            # interpreter so maturin uses its bundled sysconfig for abi3.
            args: --release --out dist -i python3.12
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, python-versions, linux-wheels, linux-wheels-extra, musl-test, fontless-test, armv7-test, macos-wheels, windows-wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only distributions — the test jobs also upload golden-*.json
          # hash artifacts, which twine would reject.
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
