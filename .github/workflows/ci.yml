name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Build and install
        shell: bash
        run: |
          pip install maturin pytest
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Test
        run: pytest tests/ -v
      - name: Golden hashes
        shell: bash
        run: python scripts/golden.py | tee "golden-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: golden-*.json

  golden:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: golden-*
          path: goldens
          merge-multiple: true
      - name: Assert cross-platform determinism
        run: |
          cd goldens
          cat *.json
          unique=$(md5sum *.json | awk '{print $1}' | sort -u | wc -l)
          if [ "$unique" != "1" ]; then
            echo "::error::Renders are not byte-identical across platforms"
            exit 1
          fi
          echo "All platforms produced identical renders."

  linux-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: "2_28"
            name: manylinux-x86_64
          - target: aarch64
            manylinux: "2_28"
            name: manylinux-aarch64
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            name: musllinux-x86_64
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            name: musllinux-aarch64
          # armv7 (32-bit) is deliberately absent: anyrender 0.11 fails to
          # compile on 32-bit targets (a size_of assertion assumes 64-bit
          # pointers). Revisit when the engine stack supports 32-bit.
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  musl-test:
    needs: linux-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - name: Test the musl wheel in Alpine
        run: |
          docker run --rm -v "$PWD":/io -w /io python:3.12-alpine sh -c '
            pip install -q dist/*.whl pytest
            python -m pytest tests/ -q'

  # Regression: fontconfig installed but zero fonts (fresh Home Assistant
  # base images). fontique 0.10 panics enumerating system fonts on such
  # hosts; we must fall back to the bundled font and still render text.
  fontless-test:
    needs: linux-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - name: Render on fontconfig-with-no-fonts Alpine
        run: |
          docker run --rm -v "$PWD":/io -w /io python:3.12-alpine sh -c '
            apk add -q fontconfig
            test "$(fc-list | wc -l)" = 0 || { echo "host has fonts; test is vacuous"; exit 1; }
            pip install -q dist/*.whl
            python scripts/fontless_check.py'

  macos-wheels:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  windows-wheels:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            args: --release --out dist
          - target: aarch64-pc-windows-msvc
            # Cross-build: no arm64 Python on the x64 runner; name the
            # interpreter so maturin uses its bundled sysconfig for abi3.
            args: --release --out dist -i python3.12
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux-wheels, musl-test, fontless-test, macos-wheels, windows-wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only distributions — the test jobs also upload golden-*.json
          # hash artifacts, which twine would reject.
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
